# Pi 1.5.2: штатные поведенческие слоты; модель независимо подключена через OpenCode Go.
model = "cheap"

[models.cheap]
provider = "opencode"
stream = true
model = "deepseek-v4.1-flash"
summary = true
effort = "high"

[module_config.model.opencode]
provider = "opencode-go"

[module_config.workflow.pi_loop]
catalog_provider = "opencode-go"

[module_config.hook.pi_compact]
catalog_provider = "opencode-go"

# Штатный bash использует OS-права worker; перед эффектами требуется approval.
[module_config.policy.codex_policy]
allow = ["read"]
allow_sandboxed = []
ask_before = ["bash", "edit", "write"]

[profile]
name = "pi"
title = "Pi"

[modules]
session_storage = "jsonl"
workflow = "pi_loop"
context = "pi_context"
policy = "codex_policy"
hooks = ["pi_compact"]

[agent_control]
surface = "none"
roles = []

[addons]
plugins = []

[components.pi-runtime]
command = "proteus-pi-module"
env_allowlist = ["HOME", "PI_CODING_AGENT_DIR", "PATH"]
[components.pi-runtime.exports.workflow.pi_loop]
[components.pi-runtime.exports.context.pi_context]
[components.pi-runtime.exports.hook.pi_compact]
[components.pi-runtime.exports.tool.pi_tools]

[components.policy]
command = "proteus-policy-pack-module"
[components.policy.exports.policy.codex_policy]

[components.opencode-model]
command = "proteus-opencode-module"
env_allowlist = ["HOME", "XDG_DATA_HOME", "PATH", "OPENCODE_API_KEY", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"]

[components.opencode-model.exports.model.opencode]

[tools]
enabled = ["read", "bash", "edit", "write"]
mcp_servers = []

[permissions]
mode = "normal"


[event_log]
path = ".proteus/events.jsonl"

[components.session-storage]
command = "proteus-session-storage-module"
transport.max_frame_bytes = 134217728

[components.session-storage.exports.session_storage.jsonl]

[components.session-storage.exports.session_storage.sqlite]
