# Pi 1.5.2: npm package and installer in Proteus-modules/tool/pi-tools.
active_provider = "chatgpt"

[providers.chatgpt]
provider = "pi_codex"
model = "gpt-6.1-sol"
stream = true
[providers.chatgpt.reasoning]
effort = "high"
summary = true

[components.pi-model]
command = "proteus-pi-module"
env_allowlist = ["HOME", "PI_CODING_AGENT_DIR", "PATH", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"]
[components.pi-model.exports.model.pi_codex]
[module_config.model.pi_codex]
implementation = "openai-codex"

[profile]
name = "pi"

[modules]
workflow = "pi_loop"
context = "pi_context"
policy = "codex_policy"
hooks = ["pi_compact"]

[agent_control]
surface = "none"
roles = []

[addons]
plugins = []

[components.pi-runtime]
command = "proteus-pi-module"
env_allowlist = ["HOME", "PI_CODING_AGENT_DIR", "PATH"]
[components.pi-runtime.exports.workflow.pi_loop]
[components.pi-runtime.exports.context.pi_context]
[components.pi-runtime.exports.hook.pi_compact]
[components.pi-runtime.exports.tool.pi_tools]

[components.policy]
command = "proteus-policy-pack-module"
[components.policy.exports.policy.codex_policy]

[tools]
enabled = ["read", "bash", "edit", "write"]
mcp_servers = []

[permissions]
mode = "normal"

# Upstream bash uses the worker's OS permissions. Ask before starting an effect.
[module_config.policy.codex_policy]
allow = ["read"]
allow_sandboxed = []
ask_before = ["bash", "edit", "write"]

[event_log]
path = ".proteus/events.jsonl"
