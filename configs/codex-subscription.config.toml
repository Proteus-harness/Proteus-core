command = "proteus-shell-tool-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[agent_control.roles.config.components.shell-tool.exports.tool.shell_tools]

[agent_control.roles.config.components.plan-tool]
command = "proteus-plan-tool-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[agent_control.roles.config.components.plan-tool.exports.tool.plan_tool]

[agent_control.roles.config.components.rust-lsp]
command = "proteus-rust-lsp-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[agent_control.roles.config.components.rust-lsp.exports.tool.rust_lsp]

[agent_control.roles.config.components.skill-pack]
