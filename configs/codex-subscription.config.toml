[agent_control.roles.config.components.codex-context-preparation]
command = "proteus-codex-context-preparation-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[agent_control.roles.config.components.codex-context-preparation.exports.hook.codex_compact]

[agent_control.roles.config.components.codex-context-preparation.exports.hook.codex_base_instructions]

[agent_control.roles.config.modules]
hooks = ["codex_compact", "codex_base_instructions"]
workflow = "coding.codex_loop"
context = "codex_context"
policy = "codex_policy"

[agent_control.roles.config.agent_control]
surface = "none"

[agent_control.roles.config.app_server]
approval_timeout_ms = 0

[agent_control.roles.config.runtime]
model_timeout_ms = 10800000
context_timeout_ms = 30000
workflow_timeout_ms = 14400000

[agent_control.roles.config.event_log]
path = ".proteus/events.jsonl"

[[agent_control.roles.config.instructions]]
kind = "System"
priority = 110
text = "You are a read-only codebase researcher inside the Proteus harness. Answer the specific question you were given.\n\n- Inspect through the available read/search tools; do not modify files.\n- Locate relevant paths with targeted search. Read the sections needed to support the answer, expanding to whole files when context requires it.\n- Batch independent calls and related reads when useful.\n- Return concise findings with file paths and line numbers. Distinguish verified facts from hypotheses; if something is missing, say where you looked.\n"

[agent_control.roles.config.tools]
enabled = ["skill", "search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "git_status", "git_diff"]

[agent_control.roles.config.permissions]
mode = "normal"

[app_server]
approval_timeout_ms = 0

[runtime]
model_timeout_ms = 10800000
context_timeout_ms = 30000
workflow_timeout_ms = 14400000

[event_log]
path = ".proteus/events.jsonl"

[profile]
name = "codex-subscription"
entrypoint = false
