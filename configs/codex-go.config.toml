# Codex workflow, upstream-инструкции и инструменты; провайдер — OpenCode Go.
include = ["codex.config.toml", "fragments/codex-go-models.toml"]
model = "go_deepseek_v4_1_flash"

[profile]
name = "codex-go"

# Адаптер выбирает нативный API и параметры каждой модели Go.
# Общая поверхность набора использует apply_patch как function tool.
[module_config.tool.codex_patch]
freeform = false

[models.go_deepseek_v4_1_flash.reasoning]
effort = "high"
summary = true

[agent_control]
surface = "collaboration"
roles = [
  { name = "explore", description = "Read-only explorer using the Codex Go profile.", config = "codex-go-explore", parallel_safe = true, max_processes = 4, timeout_ms = 14400000, max_summary_bytes = 8192 },
  { name = "coder", description = "Isolated coder using the Codex Go profile.", config = "codex-go-coder", isolation = "worktree", max_processes = 4, timeout_ms = 14400000, max_summary_bytes = 8192 },
]
