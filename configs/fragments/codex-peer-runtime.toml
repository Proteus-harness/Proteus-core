# Общая process-peer сборка для Codex-shaped дочерних агентов. Provider,
# role prompt, tool surface и policy задаются named child config/profile.

include = "codex-components.toml"

[modules]
session_storage = "jsonl"
hooks = ["codex_compact"]
workflow = "coding.codex_loop"
context = "codex_context"

[agent_control]
surface = "none"

[module_config.hook.codex_compact]
# Порог по умолчанию: 90% окна модели; trigger_tokens может задать меньший.

[module_config.tool.codex_patch]
reject_self_move = true

[module_config.context.codex_context]
search_provider = "rg_search"
providers = ["project_instructions", "skills", "environment"]
max_context_bytes = 60000
max_bytes_per_file = 12000
project_doc_max_bytes = 32768
project_instruction_files = ["AGENTS.override.md", "AGENTS.md"]

[app_server]
approval_timeout_ms = 0

[runtime]
model_timeout_ms = 10800000
context_timeout_ms = 30000
workflow_timeout_ms = 14400000

[event_log]
path = ".proteus/events.jsonl"

[components.reference-workflow]
release_when_idle = true

[components.reference-context]
release_when_idle = true

[components.rg-search]
release_when_idle = true

[components.file-tools]
release_when_idle = true

[components.git-tools]
release_when_idle = true

[components.skill-pack]
release_when_idle = true

[components.policy-pack]
release_when_idle = true

[components.codex-context-preparation]
release_when_idle = true

[components.session-storage]
command = "proteus-session-storage-module"
transport.max_frame_bytes = 134217728

[components.session-storage.exports.session_storage.jsonl]

[components.session-storage.exports.session_storage.sqlite]
