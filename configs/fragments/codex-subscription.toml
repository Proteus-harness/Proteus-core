# Отличия подписочной сборки от общих behavior, profile и OAuth-подключения.
# Роли и порядок tools заменяют массивы целиком; их значения здесь намеренны.
[providers.chatgpt]
reasoning_efforts = []

[[agent_control.roles]]
name = "explore"
description = "Read-only codebase explorer. Uses the ChatGPT subscription profile."
config = "codex-explore"
parallel_safe = true
max_processes = 4
timeout_ms = 14400000
max_summary_bytes = 8192

[module_config.context.codex_context]
providers = ["project_instructions", "environment", "repo_tree"]

[tools]
enabled = ["apply_patch", "exec_command", "find_files", "git_diff", "git_status", "grep", "list_dir", "lsp_diagnostics", "read_file", "read_many_files", "remember_fact", "request_permissions", "request_user_input", "search", "shell", "skill", "update_plan", "write_file", "write_stdin"]
