[components.reference-model]
command = "proteus-model-pack-module"
env_allowlist = ["HOME", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"]

[components.reference-model.exports.model.opencode_go]

[module_config.model.opencode_go]
implementation = "openai_compatible"
base_url = "https://opencode.ai/inference/go/openai/v1"
api_key_file = "$HOME/.config/Proteus-agent/secrets/opencode-go.json"
api_key_json_key = "api_key"
user_agent = "Proteus/0.1.0"
session_header = "x-opencode-session"
max_input_tokens = 180000
prompt_cache = true

[module_config.model.opencode_go.capabilities]
supports_image_input = false
supports_parallel_tool_calls = false
supports_freeform_tools = false
supports_json_schema = false
supports_reasoning_config = true

# Нативное подключение OpenCode Go; каталог предоставляет model export.
[components.opencode-model]
command = "proteus-opencode-module"
env_allowlist = ["HOME", "XDG_DATA_HOME", "PATH", "OPENCODE_API_KEY", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"]
[components.opencode-model.exports.model.opencode]

[module_config.model.opencode]
provider = "opencode-go"

# Модель и effort выбирает личный overlay; доступные варианты приходят из SDK.
[providers.opencode-go]
provider = "opencode"
stream = true
[providers.opencode-go.reasoning]
summary = true

# Этот transport использует JSON arguments вместо freeform patch surface.
[module_config.tool.codex_patch]
freeform = false
