# Подключение OpenCode Go через Pi model export; каталог и выбор задаются отдельно.
[components.pi-go-model]
command = "proteus-pi-module"
env_allowlist = ["HOME", "PATH", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"]
[components.pi-go-model.exports.model.pi_codex]

[module_config.model.pi_codex]
implementation = "opencode-go"

# Этот transport использует JSON arguments вместо freeform patch surface.
[module_config.tool.codex_patch]
freeform = false
