# Only the model slot uses the Pi adapter; workflow and tools stay Codex.
[components.pi-model]
command = "proteus-pi-module"
env_allowlist = ["HOME", "PATH", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"]
[components.pi-model.env]
PI_CODING_AGENT_DIR = "~/.config/Proteus-agent/pi-go"
[components.pi-model.exports.model.pi_codex]
[module_config.model.pi_codex]
implementation = "opencode-go"
