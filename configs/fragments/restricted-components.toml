# Только перечисленные одноэкспортные компоненты ограничены на уровне ОС.
# /usr, /lib, /lib64 и /bin — явные read-only зависимости runtime.
# read_executable открывает ровно executable из PATH, без соседней директории.
# Чистые workflow/policy/compact работают в /usr без доступа к workspace.

[components.reference-workflow]
command = "proteus-coding-workflow-module"
cwd = "/usr"

[components.reference-workflow.sandbox]
mode = "restricted"
read_executable = true
read_only = ["/usr", "/lib", "/lib64", "/bin"]
read_write = []
network = false

[components.reference-workflow.exports.workflow."coding.codex_loop"]

[components.reference-context]
command = "proteus-context-pack-module"

[components.reference-context.sandbox]
mode = "restricted"
read_executable = true
read_only = ["/usr", "/lib", "/lib64", "/bin", "."]
read_write = []
network = false

[components.reference-context.exports.context.codex_context]

[components.reference-policy]
command = "proteus-policy-pack-module"
cwd = "/usr"

[components.reference-policy.sandbox]
mode = "restricted"
read_executable = true
read_only = ["/usr", "/lib", "/lib64", "/bin"]
read_write = []
network = false

[components.reference-policy.exports.policy.codex_policy]

[components.reference-compact]
command = "proteus-codex-context-preparation-module"
cwd = "/usr"

[components.reference-compact.sandbox]
mode = "restricted"
read_executable = true
read_only = ["/usr", "/lib", "/lib64", "/bin"]
read_write = []
network = false

[components.reference-compact.exports.hook.codex_compact]

[components.reference-search-tool]
command = "proteus-rg-search-module"

[components.reference-search-tool.sandbox]
mode = "restricted"
read_executable = true
read_only = ["/usr", "/lib", "/lib64", "/bin", "."]
read_write = []
network = false

[components.reference-search-tool.exports.tool.rg_search]

[components.reference-search-provider]
command = "proteus-rg-search-module"

[components.reference-search-provider.sandbox]
mode = "restricted"
read_executable = true
read_only = ["/usr", "/lib", "/lib64", "/bin", "."]
read_write = []
network = false

[components.reference-search-provider.exports.context_provider.rg_search]

[components.memory-pack]
command = "proteus-memory-pack-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.memory-pack.exports.tool.jsonl_memory]

[components.codex-patch]
command = "proteus-codex-patch-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.codex-patch.exports.tool.codex_patch]

[components.file-tools]
command = "proteus-file-tools-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.file-tools.exports.tool.file_tools]

[components.git-tools]
command = "proteus-git-tools-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.git-tools.exports.tool.git_tools]

[components.shell-tool]
command = "proteus-shell-tool-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.shell-tool.exports.tool.shell_tools]

[components.plan-tool]
command = "proteus-plan-tool-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.plan-tool.exports.tool.plan_tool]

[components.rust-lsp]
command = "proteus-rust-lsp-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.rust-lsp.exports.tool.rust_lsp]

[components.skill-pack]
command = "proteus-skill-pack-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.skill-pack.exports.tool.skill_tool]

[components.skill-pack.exports.context_provider.skills]

[components.policy-pack]
command = "proteus-policy-pack-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.policy-pack.exports.tool.policy_tools]

