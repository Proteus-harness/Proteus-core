[package]
name = "proteus-rust-tool-example"
version = "0.1.0-alpha.2"
edition = "2024"
publish = false

# This is a standalone author project, not a Core workspace member.
[workspace]

[dependencies]
anyhow = "1"
proteus-module-sdk = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "59da60a35929b6ab73550ee39c4f07f3bfa513a1" }
serde = { version = "1", features = ["derive"] }
