include = "../../configs/proteus.provider.example.toml"

[[instructions]]
kind = "System"
file = "../../configs/prompts/direct-patch.md"
priority = 90

[profile]
name = "coding-local"

[modules]
hooks = ["codex_compact"]
workflow = "coding.single_loop"
context = "repo_aware"
policy = "ask_write"

[components.reference-workflow]
command = "proteus-coding-workflow-module"

[components.reference-workflow.exports.workflow."coding.single_loop"]

[components.reference-context]
command = "proteus-context-pack-module"

[components.reference-context.exports.context.repo_aware]

[components.rg-search]
command = "proteus-rg-search-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.rg-search.exports.tool.rg_search]

[components.rg-search.exports.context_provider.rg_search]

[components.memory-pack]
command = "proteus-memory-pack-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.memory-pack.exports.tool.jsonl_memory]

[components.direct-patch]
command = "proteus-direct-patch-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.direct-patch.exports.tool.direct_patch]

[components.file-tools]
command = "proteus-file-tools-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.file-tools.exports.tool.file_tools]

[components.git-tools]
command = "proteus-git-tools-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.git-tools.exports.tool.git_tools]

[components.shell-tool]
command = "proteus-shell-tool-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.shell-tool.exports.tool.shell_tools]

[components.plan-tool]
command = "proteus-plan-tool-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.plan-tool.exports.tool.plan_tool]

[components.rust-lsp]
command = "proteus-rust-lsp-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.rust-lsp.exports.tool.rust_lsp]

[components.skill-pack]
command = "proteus-skill-pack-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.skill-pack.exports.tool.skill_tool]

[components.skill-pack.exports.context_provider.skills]

[components.policy-pack]
command = "proteus-policy-pack-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.policy-pack.exports.tool.policy_tools]

[components.policy-pack.exports.policy.ask_write]

[components.codex-context-preparation]
command = "proteus-codex-context-preparation-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.codex-context-preparation.exports.hook.codex_compact]

[agent_control]
surface = "none"

[tools]
# Full local coding toolset. File I/O and repo navigation come from
# file-tools, git helpers come from git-tools, shell comes from shell-tool,
# apply_patch, search and remember_fact come from explicitly selected process tools.
# Run ./install.sh before using this profile so the worker is on PATH.
enabled = ["skill", "search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "lsp_diagnostics", "git_status", "git_diff", "request_user_input", "apply_patch", "write_file", "shell", "remember_fact"]

[permissions]
mode = "normal"

[module_config.policy.ask_write]
allow = ["skill", "search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "git_status", "git_diff", "request_user_input"]
ask_before = ["lsp_diagnostics", "apply_patch", "write_file", "shell", "remember_fact"]

[module_config.hook.codex_compact]
# Порог по умолчанию: 90% окна модели; trigger_tokens может задать меньший.

[module_config.context.repo_aware]
search_provider = "rg_search"
providers = ["project_instructions", "skills", "manifest", "git_status", "repo_tree", "memory", "search"]
max_context_bytes = 60000
max_bytes_per_file = 8000
max_search_results = 50
memory_limit = 5
repo_tree_max_entries = 300
repo_tree_max_depth = 3
repo_tree_skip_entries = [".git", "target", "node_modules", ".proteus", "sessions", "dist", "build", ".env", "secrets.json", "config.local.json"]
project_instruction_files = ["AGENTS.override.md", "AGENTS.md", "CLAUDE.md", ".cursorrules"]
manifest_files = ["Cargo.toml", "package.json", "pyproject.toml", "go.mod", "pom.xml", "build.gradle", "composer.json"]

[app_server]
approval_timeout_ms = 0

[runtime]
model_timeout_ms = 10800000
context_timeout_ms = 30000
workflow_timeout_ms = 14400000

[event_log]
path = ".proteus/events.jsonl"
