active_provider = "fake"

[[instructions]]
kind = "System"
file = "../../configs/prompts/direct-patch.md"
priority = 90

[profile]
name = "opt-in-hooks"

[providers.fake]
provider = "fake"
model = "fake-tool-model"
stream = true

[modules]
hooks = ["tool_selection.dynamic", "codex_compact", "hook.instructions", "hook.output_budget"]
workflow = "coding.codex_loop"
context = "simple"
policy = "allow_all"

# Один component экспортирует workflow, tools и две независимые hook contributions.
# Их authority задаётся активным slot; дополнительные contributions включены в этом примере.
[components.coding-workflow]
command = "proteus-coding-workflow-module"

[components.coding-workflow.exports.workflow."coding.codex_loop"]

[components.rg-search]
command = "proteus-rg-search-module"

[components.rg-search.exports.tool.rg_search]

[components.rg-search.exports.context_provider.rg_search]

[components.memory-pack]
command = "proteus-memory-pack-module"

[components.memory-pack.exports.tool.jsonl_memory]

[components.memory-pack.exports.context_provider.jsonl_memory]

[components.direct-patch]
command = "proteus-direct-patch-module"

[components.direct-patch.exports.tool.direct_patch]

[components.file-tools]
command = "proteus-file-tools-module"

[components.file-tools.exports.tool.file_tools]

[components.git-tools]
command = "proteus-git-tools-module"

[components.git-tools.exports.tool.git_tools]

[components.shell-tool]
command = "proteus-shell-tool-module"

[components.shell-tool.exports.tool.shell_tools]

[components.plan-tool]
command = "proteus-plan-tool-module"

[components.plan-tool.exports.tool.plan_tool]

[components.rust-lsp]
command = "proteus-rust-lsp-module"

[components.rust-lsp.exports.tool.rust_lsp]

[components.skill-pack]
command = "proteus-skill-pack-module"

[components.skill-pack.exports.tool.skill_tool]

[components.policy-pack]
command = "proteus-policy-pack-module"

[components.policy-pack.exports.tool.policy_tools]

[components.policy-pack.exports.policy.allow_all]

[components.context-pack]
command = "proteus-context-pack-module"

[components.context-pack.exports.context.simple]

[components.codex-context-preparation]
command = "proteus-codex-context-preparation-module"

[components.codex-context-preparation.exports.hook.codex_compact]

[components.tool-selection-hook]
command = "proteus-tool-selection-hook-module"

[components.tool-selection-hook.exports.hook."tool_selection.dynamic"]

[components.hook-pack]
command = "proteus-hook-pack-module"

[components.hook-pack.exports.hook."hook.instructions"]
timeout_ms = 5000

[components.hook-pack.exports.hook."hook.output_budget"]
timeout_ms = 5000

[components.model-pack]
command = "proteus-model-pack-module"

[components.model-pack.exports.model.fake]

[tools]
enabled = ["read_file", "request_user_input", "remember_fact", "recall_memory"]

[permissions]
mode = "normal"

[module_config.context.simple]
search_provider = "rg_search"
memory_provider = "jsonl_memory"
max_search_results = 5

[module_config.tool.jsonl_memory]
path = ".proteus/p4-memory.jsonl"

[module_config.context_provider.jsonl_memory]
path = ".proteus/p4-memory.jsonl"

[module_config.hook."tool_selection.dynamic"]
max_hot_tools = 8
always_include = ["read_file", "request_user_input"]

[runtime]
model_timeout_ms = 10000
context_timeout_ms = 10000
workflow_timeout_ms = 30000

[event_log]
path = ".proteus/events.jsonl"

[module_config.model.fake]
implementation = "fake"

# Contributions применяются в порядке modules.hooks; этот профиль opt-in.
[module_config.hook."hook.instructions"]
text = "Перед изменением файлов объясни измеримый ожидаемый результат."
placement = "append"

[module_config.hook."hook.output_budget"]
max_bytes = 16000
head_bytes = 12000
