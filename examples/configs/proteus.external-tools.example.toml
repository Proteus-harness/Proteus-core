active_provider = "fake"

[profile]
name = "external-tools"

[providers.fake]
provider = "fake"
model = "fake-tool-model"
stream = true

[modules]
workflow = "coding.plan_execute_review"
context = "simple"
policy = "ask_write"

[components.reference-workflow]
command = "proteus-coding-workflow-module"

[components.reference-workflow.exports.workflow."coding.plan_execute_review"]

[components.reference-context]
command = "proteus-context-pack-module"

[components.reference-context.exports.context.simple]

[components.reference-capabilities]
command = "proteus-policy-pack-module"

[components.reference-capabilities.exports.policy.ask_write]

[components.python-search]
command = "python3"
args = ["examples/modules/search-process/search.py"]

[components.python-search.exports.tool.python_rg]
timeout_ms = 60000

[components.python-search.exports.context_provider.python_rg]
timeout_ms = 60000

[components.reference-model]
command = "proteus-model-pack-module"
env_allowlist = ["HOME", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"]

[components.reference-model.exports.model.fake]

[tools]
enabled = ["search"]

[permissions]
mode = "normal"

[module_config.policy.ask_write]
allow = ["search"]

[module_config.context.simple]
search_provider = "python_rg"
max_search_results = 50

[app_server]
approval_timeout_ms = 0

[event_log]
path = ".proteus/events.jsonl"

[module_config.model.fake]
implementation = "fake"
