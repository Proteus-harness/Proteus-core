# Тестовый aggregate fixture: соберите proteus-reference-module отдельно.
# В штатную поставку он не входит; рабочие профили используют независимые пакеты.
active_provider = "fake"

[[instructions]]
kind = "System"
file = "../../configs/prompts/direct-patch.md"
priority = 90

[profile]
name = "component-runtime-evidence"

[providers.fake]
provider = "fake"
model = "fake-tool-model"
stream = true

[modules]
hooks = ["tool_selection.dynamic", "codex_compact"]
workflow = "coding.codex_loop"
context = "simple"
policy = "allow_all"

# Этот профиль намеренно собирает callback-связанные exports в один process.
# Это отдельный failure domain для P4 evidence, а не новый обязательный default.
[components.reference-agent]
command = "proteus-reference-module"

[components.reference-agent.exports.workflow."coding.codex_loop"]

[components.reference-agent.exports.tool.rg_search]

[components.reference-agent.exports.context_provider.rg_search]

[components.reference-agent.exports.tool.jsonl_memory]

[components.reference-agent.exports.context_provider.jsonl_memory]

[components.reference-agent.exports.context.simple]

[components.reference-agent.exports.policy.allow_all]

[components.reference-agent.exports.tool.direct_patch]

[components.reference-agent.exports.hook.codex_compact]

[components.reference-agent.exports.hook."tool_selection.dynamic"]

[components.reference-agent.exports.tool."reference.tools"]

[tools]
enabled = ["read_file", "request_user_input", "remember_fact", "recall_memory"]

[permissions]
mode = "normal"

[module_config.context.simple]
search_provider = "rg_search"
memory_provider = "jsonl_memory"
max_search_results = 5

[module_config.tool.jsonl_memory]
path = ".proteus/p4-memory.jsonl"

[module_config.context_provider.jsonl_memory]
path = ".proteus/p4-memory.jsonl"

[module_config.hook."tool_selection.dynamic"]
max_hot_tools = 8
always_include = ["read_file", "request_user_input"]

[runtime]
model_timeout_ms = 10000
context_timeout_ms = 10000
workflow_timeout_ms = 30000

[event_log]
path = ".proteus/events.jsonl"

[components.reference-agent.exports.model.fake]

[module_config.model.fake]
implementation = "fake"
