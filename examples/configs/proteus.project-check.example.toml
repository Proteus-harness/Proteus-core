[profile]
name = "deterministic-project-check"

# Модель не обязательна: ошибки тестов возвращаются с выводом команды.
# Чтобы добавить объяснение ошибки моделью, задайте active_provider,
# соответствующий providers profile и model export обычного component.

[modules]
workflow = "coding.project_check"
policy = "ask_write"

# One ordinary component exports the controller and its configured tools. The
# host still computes authority per active export; this is not union authority.
[components.coding-workflow]
command = "proteus-coding-workflow-module"

[components.coding-workflow.exports.workflow."coding.project_check"]

[components.policy-pack]
command = "proteus-policy-pack-module"

[components.policy-pack.exports.policy.ask_write]

[components.policy-pack.exports.tool.policy_tools]

[components.file-tools]
command = "proteus-file-tools-module"

[components.file-tools.exports.tool.file_tools]

[components.git-tools]
command = "proteus-git-tools-module"

[components.git-tools.exports.tool.git_tools]

[components.shell-tool]
command = "proteus-shell-tool-module"

[components.shell-tool.exports.tool.shell_tools]

[components.plan-tool]
command = "proteus-plan-tool-module"

[components.plan-tool.exports.tool.plan_tool]

[components.rust-lsp]
command = "proteus-rust-lsp-module"

[components.rust-lsp.exports.tool.rust_lsp]

[components.skill-pack]
command = "proteus-skill-pack-module"

[components.skill-pack.exports.tool.skill_tool]

[tools]
enabled = ["git_status", "list_dir", "shell"]

[permissions]
mode = "normal"

[module_config.policy.ask_write]
allow = ["git_status", "list_dir"]
ask_before = ["shell"]

[agent_control]
surface = "none"

[app_server]
approval_timeout_ms = 0

[runtime]
model_timeout_ms = 120000
context_timeout_ms = 10000
workflow_timeout_ms = 900000

[event_log]
path = ".proteus/events.jsonl"
