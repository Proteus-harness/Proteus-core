[package]
name = "proteus-native"
version = "0.0.0-dev"
edition = "2024"
publish = false
description = "Experimental native GPUI client for the Proteus app server"
license = "MIT"

[dependencies]
gpui-kit = { version = "0.7.1", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
proteus-app-common = { path = "../app/common" }
proteus-contracts = { path = "../../crates/proteus-contracts" }
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
alacritty_terminal = "0.25"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# GPUI, text shaping and tree-sitter are unusably slow unoptimized; only the
# client itself stays at opt-level 0 for quick rebuilds.
[profile.dev.package."*"]
opt-level = 2
